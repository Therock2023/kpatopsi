<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="حاسبة تحويل الضغط من PSI إلى Bar - تحويل رطل لكل بوصة مربعة إلى بار بدقة عالية" />
    <meta name="keywords" content="تحويل psi الى bar, محول الضغط, رطل لكل بوصة مربعة, بار, حاسبة الضغط" />
    <title>تحويل PSI إلى Bar | محول الضغط الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Hero Section -->
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">
                تحويل PSI إلى Bar
            </h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                محول دقيق وسهل الاستخدام للتحويل بين وحدات الضغط PSI و Bar
            </p>
        </div>

        <!-- Converter Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-12">
            <div class="max-w-2xl mx-auto">
                <div class="mb-6">
                    <label class="block text-gray-700 text-lg font-medium mb-3" for="psi-input">
                        أدخل قيمة الضغط (PSI):
                    </label>
                    <div class="relative">
                        <input type="number" 
                            id="psi-input" 
                            class="w-full px-4 py-3 text-lg bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            placeholder="مثال: 14.5">
                        <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500">PSI</span>
                    </div>
                </div>

                <div class="flex gap-4 mb-8">
                    <button onclick="convertToBar()" 
                        class="flex-1 bg-blue-600 text-white py-4 px-6 rounded-xl text-lg font-medium hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition-all">
                        تحويل
                    </button>
                    <button onclick="clearInput()" 
                        class="flex-1 bg-gray-100 text-gray-700 py-4 px-6 rounded-xl text-lg font-medium hover:bg-gray-200 focus:ring-4 focus:ring-gray-200 transition-all">
                        مسح
                    </button>
                </div>

                <div id="result" class="hidden">
                    <div class="bg-green-50 border border-green-200 rounded-xl p-6 text-center">
                        <p class="text-lg text-gray-700 mb-2">النتيجة:</p>
                        <p class="text-3xl font-bold text-green-600">
                            <span id="result-value"></span> Bar
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Reference -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-12">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">معلومات سريعة عن التحويل</h2>
            <ul class="space-y-4 text-gray-600">
                <li>1 PSI = 0.0689476 Bar</li>
                <li>14.5038 PSI = 1 Bar</li>
                <li>145.038 PSI = 10 Bar</li>
            </ul>
        </div>

        <!-- Other Converters -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">محولات الضغط الأخرى</h2>
            <div class="grid md:grid-cols-3 gap-4">
                <a href="kpa-to-psi.html" class="block p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors">
                    <span class="text-lg font-medium text-blue-600">تحويل KPA إلى PSI</span>
                </a>
                <a href="kpa-to-pascal.html" class="block p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors">
                    <span class="text-lg font-medium text-blue-600">تحويل KPA إلى Pascal</span>
                </a>
                <a href="kpa-to-bar.html" class="block p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors">
                    <span class="text-lg font-medium text-blue-600">تحويل KPA إلى Bar</span>
                </a>
            </div>
        </div>
    </main>

    <script>
        function convertToBar() {
            const psiInput = document.getElementById('psi-input');
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('result-value');
            
            if (psiInput.value) {
                const psi = parseFloat(psiInput.value);
                const bar = (psi * 0.0689476).toFixed(4);
                resultValue.textContent = bar;
                resultDiv.classList.remove('hidden');
            }
        }

        function clearInput() {
            document.getElementById('psi-input').value = '';
            document.getElementById('result').classList.add('hidden');
        }

        document.getElementById('psi-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertToBar();
            }
        });
    </script>
</body>
</html>
